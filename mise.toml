[tools]
# mr_boxington routes cargo through the shared build cache, so worktrees and
# sibling checkouts reuse each other's compiled crates instead of each growing
# a full target/
rust = { version = "latest", mr_boxington = true }
mr-boxington = "latest"

# `make release`: cross builds the static musl binaries (needs Docker or
# Podman running), gh publishes the GitHub release
"cargo:cross" = "0.2.5"
gh = "latest"
